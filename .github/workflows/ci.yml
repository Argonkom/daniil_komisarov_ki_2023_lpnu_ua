name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            script: bash ci.sh
          - os: windows-latest
            shell: cmd
            script: ci.bat
          - os: macos-latest
            shell: bash
            script: bash ci.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run CI script
        run: ${{ matrix.script }}
        shell: ${{ matrix.shell }}
